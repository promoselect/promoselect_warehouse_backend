version: '3.8'

services:
  warehouse_backend:
    image: node:20-alpine
    ports:
      - ${BACKEND_PORT}:3000
    working_dir: /app
    volumes:
      - ${REPO_PATH}:/app
    command: sh -c "npm install && npm run dev"
    networks:
      - warehouse_network
    depends_on:
      warehouse_db:
        condition: service_healthy
    restart: always

  warehouse_db:
    image: postgres:15-alpine
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
      - ${INIT_DUMP_FILE_PATH}:/docker-entrypoint-initdb.d/init.sql
    networks:
      - warehouse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - ${PGADMIN_PORT}:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    networks:
      - warehouse_network
    depends_on:
      warehouse_db:
        condition: service_healthy


networks:
  warehouse_network:
    driver: bridge
