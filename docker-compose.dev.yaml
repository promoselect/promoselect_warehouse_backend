version: '3.8'

services:
  warehouse_backend:
    image: node:20-alpine
    ports:
      - ${BACKEND_PORT}:3000
    volumes:
      - repo_bind_mount:/app/src
    working_dir: /app
    command: sh -c "npm install && npm run start"
    networks:
      - warehouse_network
    depends_on:
      - warehouse_db
        condition: service_healthy
    restart: always

  warehouse_db:
    image: postgres:15-alpine
    ports:
      - ${DB_PORT}:5432
    secrets:
      - warehouse_db_env
    volumes:
      - ${DB_DATA_DIR}:/var/lib/postgresql/data
      - init_dump:/docker-entrypoint-initdb.d/init.sql
    networks:
      - warehouse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - ${PGADMIN_PORT}:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    networks:
      - warehouse_network
    depends_on:
      - warehouse_db
        condition: service_healthy

volumes:
  repo_bind_mount:
    driver_opts:
      type: none
      device: ${REPO_BIND_MOUNT_DIR}
      o: bind
      device_read_only: true
  
  init_dump:
    driver_opts:
      type: none

networks:
  warehouse_network:
    driver: bridge


secrets:
  warehouse_db_env:
    file: ./secrets/warehouse_db_env